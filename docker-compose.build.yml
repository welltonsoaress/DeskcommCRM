# Override OPCIONAL para buildar a imagem localmente em vez de puxar do registry.
# Uso (avançado — requer VPS >=4GB RAM ou swap; build leva ~15-25min num VPS):
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# O caminho normal (leigo) NÃO usa este arquivo — puxa a imagem pronta do GHCR.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Sem args de segredo: a imagem é genérica (NEXT_PUBLIC_* viram placeholder
      # no build e os valores reais entram em runtime via env_file). APP_VERSION
      # não é segredo — é o que /api/v1/health responde, e sem ele a imagem
      # local diria "desconhecido", que é a resposta certa para uma imagem que
      # não veio de release nenhuma.
      args:
        APP_VERSION: ${APP_VERSION:-local}
        APP_REVISION: ${APP_REVISION:-unknown}
        APP_RELEASE_TAG: ${APP_RELEASE_TAG:-}
        APP_DISTRIBUTION_ID: striva-sales
    image: ${APP_IMAGE:-striva-sales:local}
    pull_policy: never

  # Builds locais são explícitos e ficam neste override, fora do compose de VPS.
  worker:
    build:
      args:
        APP_VERSION: ${APP_VERSION:-local}
        APP_REVISION: ${APP_REVISION:-unknown}
        APP_RELEASE_TAG: ${APP_RELEASE_TAG:-}
        APP_DISTRIBUTION_ID: striva-sales
    image: ${WORKER_IMAGE:-striva-worker:local}
    pull_policy: never

  scheduler:
    build:
      args:
        APP_VERSION: ${APP_VERSION:-local}
        APP_REVISION: ${APP_REVISION:-unknown}
        APP_RELEASE_TAG: ${APP_RELEASE_TAG:-}
        APP_DISTRIBUTION_ID: striva-sales
    image: ${SCHEDULER_IMAGE:-striva-scheduler:local}
    pull_policy: never
