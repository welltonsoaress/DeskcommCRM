# Stack local de dependências do DeskcommCRM.
#
# A aplicação Next roda no host; Compose sobe WAHA, worker, scheduler e Redis REST.
# Postgres, Auth e Storage vêm do Supabase Cloud.
#
# Uso: docker compose --env-file .env.local up -d --build
# App: http://localhost:3000 | WAHA: http://localhost:3030/dashboard/
# Redis REST fica publicado apenas em 127.0.0.1:8079.
#
# Em produção, use docker-compose.prod.yml; este arquivo é DEV ONLY.

services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Hash SHA512 hex da api key (NÃO plaintext). Cliente envia plaintext em X-Api-Key.
      WAHA_API_KEY: sha512:${WAHA_API_KEY_SHA512}
      # Webhook base URL — precisa ser pública (use ngrok/cloudflared em dev).
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria o próprio WAHA e o webhook nunca chegaria. Porta 3002:
      # a stack da fusão é isolada do checkout principal (3001 é do gov-loop).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      # HMAC SHA512 do payload, validado server-side via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Engine NOWEB por default (mais leve, ~150MB; estável). O env é
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE NÃO existe no WAHA e caía
      # silenciosamente no default WEBJS (browser, trava a sessão).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Storage de mídia: Supabase Storage via Backend (NÃO inline base64).
      WAHA_DASHBOARD_ENABLED: "true"
      # Sem isto o container volta (ou o Docker Desktop acorda) e as sessões
      # ficam STOPPED — o front abre em "Conectando…" e as mensagens do período
      # fora não chegam. True retoma as que já existiam; não pede QR de novo.
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      # /ping é o único endpoint sem auth desta build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Postgres = Supabase (SUPABASE_DB_URL no
  # .env.local). Sobe junto do WAHA: `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.local
    environment:
      # dentro do container, localhost é o próprio worker — o WAHA está na rede
      # do compose (serviço waha, porta interna 3000). Sobrepõe o .env.local.
      WAHA_API_BASE_URL: http://waha:3000
      # O worker usa o gateway REST interno; o Next no host usa localhost:8079.
      UPSTASH_REDIS_REST_URL: http://srh
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
    depends_on:
      srh:
        condition: service_started
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: deskcomm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    container_name: deskcomm-redis-rest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "127.0.0.1:8079:80"
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: deskcomm-scheduler
    restart: unless-stopped
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    extra_hosts:
      - "app:host-gateway"

volumes:
  waha-data:
  waha-media:
